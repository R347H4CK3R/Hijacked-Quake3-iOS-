name: Build Standalone QVMs

on:
  push:
    branches: [dev/hijacked-port]
    paths:
      - '.github/workflows/build-standalone-qvms.yml'
      - 'runtime/STANDALONE.md'
  workflow_dispatch:

jobs:
  build-qvms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned ioquake3 source
        run: |
          git clone https://github.com/ioquake/ioq3.git "$RUNNER_TEMP/ioq3"
          cd "$RUNNER_TEMP/ioq3"
          git checkout 588393618dbc82e7207c21c6ddecca229944a03a
          test "$(git rev-parse HEAD)" = "588393618dbc82e7207c21c6ddecca229944a03a"

      - name: Build baseq3 QVMs only
        run: |
          cd "$RUNNER_TEMP/ioq3"
          make -j2 \
            BUILD_CLIENT=0 \
            BUILD_SERVER=0 \
            BUILD_BASEGAME=1 \
            BUILD_MISSIONPACK=0 \
            BUILD_GAME_SO=0 \
            BUILD_GAME_QVM=1

      - name: Collect and verify QVMs
        run: |
          OUT="$RUNNER_TEMP/standalone-baseq3/vm"
          mkdir -p "$OUT"
          for NAME in qagame cgame ui; do
            SRC="$(find "$RUNNER_TEMP/ioq3/build" -type f -name "$NAME.qvm" | head -1)"
            test -n "$SRC"
            test -s "$SRC"
            cp "$SRC" "$OUT/$NAME.qvm"
          done
          ls -lh "$OUT"
          sha256sum "$OUT"/*.qvm

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-baseq3-qvms
          path: ${{ runner.temp }}/standalone-baseq3
          if-no-files-found: error
