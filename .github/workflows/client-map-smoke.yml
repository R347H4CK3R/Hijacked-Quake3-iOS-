name: Hijacked Client Map Smoke

on:
  push:
    branches: [dev/hijacked-port]
    paths:
      - '.github/workflows/client-map-smoke.yml'
      - 'runtime/hijacked-device.bsp.zlib.b64'
  workflow_dispatch:

jobs:
  client-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install graphical smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libsdl2-dev libgl1-mesa-dev libopenal-dev libcurl4-openssl-dev

      - name: Fetch and build pinned ioquake3 client plus QVMs
        run: |
          git clone https://github.com/ioquake/ioq3.git "$RUNNER_TEMP/ioq3"
          cd "$RUNNER_TEMP/ioq3"
          git checkout 588393618dbc82e7207c21c6ddecca229944a03a
          test "$(git rev-parse HEAD)" = "588393618dbc82e7207c21c6ddecca229944a03a"
          cmake -S "$RUNNER_TEMP/ioq3" -B "$RUNNER_TEMP/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CLIENT=ON \
            -DBUILD_SERVER=OFF \
            -DBUILD_RENDERER_GL1=ON \
            -DBUILD_RENDERER_GL2=OFF \
            -DBUILD_GAME_LIBRARIES=OFF \
            -DBUILD_GAME_QVMS=ON \
            -DBUILD_STANDALONE=ON
          cmake --build "$RUNNER_TEMP/build" -- -j2
          CLIENT="$(find "$RUNNER_TEMP/build" -type f -perm -111 \( -name 'ioquake3*' -o -name 'iofoo3*' \) ! -name 'ioq3ded*' -print -quit)"
          RENDERER="$(find "$RUNNER_TEMP/build" -type f -name 'renderer_opengl1.so' -print -quit)"
          test -x "$CLIENT"
          test -s "$RENDERER"
          printf '%s\n' "$CLIENT" > "$RUNNER_TEMP/client-path.txt"
          for NAME in qagame cgame ui; do
            QVM="$(find "$RUNNER_TEMP/build" -type f -name "$NAME.qvm" -print -quit)"
            test -s "$QVM"
            mkdir -p "$RUNNER_TEMP/qvms/vm"
            cp "$QVM" "$RUNNER_TEMP/qvms/vm/$NAME.qvm"
          done

      - name: Stage verified standalone Hijacked runtime
        run: |
          ROOT="$RUNNER_TEMP/runtime"
          GAME="$ROOT/foobar"
          mkdir -p "$GAME/maps" "$GAME/vm"
          cp "$RUNNER_TEMP/qvms/vm/"*.qvm "$GAME/vm/"
          export BSP_OUT="$GAME/maps/hijacked.bsp"
          python3 - <<'PY'
          import base64, os, struct, zlib
          from pathlib import Path
          encoded = ''.join(Path('runtime/hijacked-device.bsp.zlib.b64').read_text().split())
          data = zlib.decompress(base64.b64decode(encoded))
          assert data[:4] == b'IBSP'
          assert struct.unpack_from('<i', data, 4)[0] == 46
          Path(os.environ['BSP_OUT']).write_bytes(data)
          PY
          cat > "$GAME/default.cfg" <<'EOF'
          seta sv_pure "0"
          seta vm_game "1"
          seta vm_cgame "1"
          seta vm_ui "1"
          seta bot_enable "0"
          seta s_initsound "0"
          seta cl_renderer "opengl1"
          seta r_mode "3"
          seta r_fullscreen "0"
          EOF
          test -s "$GAME/maps/hijacked.bsp"
          test -s "$GAME/vm/qagame.qvm"
          test -s "$GAME/vm/cgame.qvm"
          test -s "$GAME/vm/ui.qvm"

      - name: Launch Hijacked in graphical client
        run: |
          CLIENT="$(cat "$RUNNER_TEMP/client-path.txt")"
          ROOT="$RUNNER_TEMP/runtime"
          set +e
          timeout 20s xvfb-run -a "$CLIENT" \
            +set fs_basepath "$ROOT" \
            +set fs_homepath "$ROOT" \
            +set sv_pure 0 \
            +set vm_game 1 \
            +set vm_cgame 1 \
            +set vm_ui 1 \
            +set bot_enable 0 \
            +set s_initsound 0 \
            +set cl_renderer opengl1 \
            +set r_fullscreen 0 \
            +set r_mode 3 \
            +map hijacked > "$RUNNER_TEMP/client-smoke.log" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/client-smoke.log"
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi
          grep -F -- 'Server: hijacked' "$RUNNER_TEMP/client-smoke.log"
          grep -F -- 'qagame loaded' "$RUNNER_TEMP/client-smoke.log"
          grep -F -- 'cgame loaded' "$RUNNER_TEMP/client-smoke.log"
          if grep -Eiq '(^|[^a-z])(fatal|error):|couldn.t load|could not load|failed to load|DEFAULT_MODEL' "$RUNNER_TEMP/client-smoke.log"; then
            echo 'Fatal graphical client signature detected'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hijacked-client-smoke-log
          path: ${{ runner.temp }}/client-smoke.log
          if-no-files-found: ignore
