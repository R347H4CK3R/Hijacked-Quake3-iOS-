name: Hijacked Device IPA Full Diagnostics

on:
  push:
    branches: [dev/hijacked-port]
    paths: ['.github/workflows/device-ipa-maptrace-v2.yml']
  workflow_dispatch:

jobs:
  qvms:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build open baseq3 QVMs
        run: |
          git clone https://github.com/ioquake/ioq3.git "$RUNNER_TEMP/ioq3"
          cd "$RUNNER_TEMP/ioq3"
          git checkout 588393618dbc82e7207c21c6ddecca229944a03a
          cmake -S . -B "$RUNNER_TEMP/ioq3-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_CLIENT=OFF -DBUILD_SERVER=OFF -DBUILD_RENDERER_GL1=OFF -DBUILD_RENDERER_GL2=OFF -DBUILD_GAME_LIBRARIES=OFF -DBUILD_GAME_QVMS=ON -DBUILD_STANDALONE=ON
          cmake --build "$RUNNER_TEMP/ioq3-build" -- -j2
          mkdir -p "$RUNNER_TEMP/qvms/vm"
          for NAME in qagame cgame ui; do cp "$(find "$RUNNER_TEMP/ioq3-build" -type f -name "$NAME.qvm" | head -1)" "$RUNNER_TEMP/qvms/vm/$NAME.qvm"; done
      - uses: actions/upload-artifact@v4
        with: {name: full-diagnostics-qvms, path: '${{ runner.temp }}/qvms'}

  device:
    needs: qvms
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: full-diagnostics-qvms, path: '${{ runner.temp }}/qvms'}
      - name: Fetch and patch Quake3-iOS
        run: |
          git clone https://github.com/tomkidd/Quake3-iOS.git "$RUNNER_TEMP/Quake3-iOS"
          cd "$RUNNER_TEMP/Quake3-iOS" && git checkout f4b38931a765315fa4c7201dfbed2dd4a9b2d65c
          cd "$GITHUB_WORKSPACE"
          PYTHONPATH=. python3 tools/patch_quake3_ios.py "$RUNNER_TEMP/Quake3-iOS"
          PYTHONPATH=. python3 tools/patch_com_init_ios.py "$RUNNER_TEMP/Quake3-iOS"
          PYTHONPATH=. python3 tools/patch_full_diagnostics_ios.py "$RUNNER_TEMP/Quake3-iOS"
      - name: Build unsigned arm64 app
        run: |
          mkdir -p "$HOME/Library/Application Support/quake3/baseq3"
          echo '// CI placeholder' > "$HOME/Library/Application Support/quake3/baseq3/ci-placeholder.cfg"
          xcodebuild -project "$RUNNER_TEMP/Quake3-iOS/Quake3-iOS.xcodeproj" -scheme Quake3-iOS -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO GCC_PREPROCESSOR_DEFINITIONS='$(inherited) STANDALONE' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          APP="$(find "$RUNNER_TEMP/DerivedData/Build/Products" -type d -path '*Release-iphoneos/Quake3-iOS.app' -print -quit)"; test -x "$APP/Quake3-iOS"; echo "$APP" > "$RUNNER_TEMP/app.txt"
      - name: Build redistributable OpenArena runtime pack
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/Usnul/queep-3-arena.git "$RUNNER_TEMP/oa"
          cd "$RUNNER_TEMP/oa"
          git sparse-checkout init --cone
          git sparse-checkout set assets/extracted/models assets/extracted/sound assets/extracted/textures assets/extracted/gfx assets/extracted/sprites assets/extracted/scripts assets/extracted/icons
          git checkout 8ff60576be4e5c979242948951872dcc499506b2
          mkdir -p "$RUNNER_TEMP/oa-pack"
          for D in models sound textures gfx sprites scripts icons; do [ ! -d "assets/extracted/$D" ] || cp -R "assets/extracted/$D" "$RUNNER_TEMP/oa-pack/"; done
          test -s "$RUNNER_TEMP/oa-pack/models/players/sarge/lower.md3"
          test -s "$RUNNER_TEMP/oa-pack/models/weapons2/machinegun/machinegun.md3"
          test -s "$RUNNER_TEMP/oa-pack/sound/misc/menu1.wav"
          cd "$RUNNER_TEMP/oa-pack" && /usr/bin/zip -qry "$RUNNER_TEMP/openarena-runtime.pk3" .
      - name: Inject complete runtime and Hijacked map
        run: |
          set -euo pipefail
          APP="$(cat "$RUNNER_TEMP/app.txt")"; mkdir -p "$APP/baseq3/vm" "$APP/baseq3/maps" "$APP/baseq3/textures/hijacked"
          cp "$RUNNER_TEMP/openarena-runtime.pk3" "$APP/baseq3/openarena-runtime.pk3"
          cp "$RUNNER_TEMP/qvms/vm/"*.qvm "$APP/baseq3/vm/"
          printf '%s\n' 'seta com_introplayed "1"' 'seta sv_pure "0"' 'seta vm_game "1"' 'seta vm_cgame "1"' 'seta vm_ui "1"' 'seta bot_enable "0"' 'seta com_maxfps "60"' 'seta r_fullscreen "1"' > "$APP/baseq3/default.cfg"
          cp runtime/HijackedConfig.cfg "$APP/baseq3/hijacked.cfg"
          BSP_OUT="$APP/baseq3/maps/hijacked.bsp" VISUAL_OUT="$APP/baseq3/textures/hijacked/visual.tga" python3 - <<'PY'
          import base64,os,struct,zlib
          from pathlib import Path
          data=zlib.decompress(base64.b64decode(''.join(Path('runtime/hijacked-device.bsp.zlib.b64').read_text().split())))
          assert data[:4]==b'IBSP' and struct.unpack_from('<i',data,4)[0]==46
          Path(os.environ['BSP_OUT']).write_bytes(data)
          w=h=64; hdr=bytearray(18); hdr[2]=2; hdr[12:14]=struct.pack('<H',w); hdr[14:16]=struct.pack('<H',h); hdr[16]=24; hdr[17]=0x20
          px=bytearray()
          for y in range(h):
            for x in range(w):
              r,g,b=(230,230,230) if ((x//8)+(y//8))&1 else (40,170,220); px+=bytes((b,g,r))
          Path(os.environ['VISUAL_OUT']).write_bytes(hdr+px)
          PY
      - name: Validate required runtime dependencies and package IPA
        run: |
          set -euo pipefail
          APP="$(cat "$RUNNER_TEMP/app.txt")"
          unzip -l "$APP/baseq3/openarena-runtime.pk3" | grep -F 'sound/misc/menu1.wav'
          unzip -l "$APP/baseq3/openarena-runtime.pk3" | grep -F 'models/players/sarge/lower.md3'
          unzip -l "$APP/baseq3/openarena-runtime.pk3" | grep -F 'models/weapons2/machinegun/machinegun.md3'
          mkdir -p "$RUNNER_TEMP/ipa/Payload"; cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"; cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/Hijacked-Quake3-iOS-full-diagnostics-unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/Hijacked-Quake3-iOS-full-diagnostics-unsigned.ipa" >/dev/null
      - uses: actions/upload-artifact@v4
        with: {name: Hijacked-Quake3-iOS-full-diagnostics-unsigned-IPA, path: Hijacked-Quake3-iOS-full-diagnostics-unsigned.ipa, if-no-files-found: error}
