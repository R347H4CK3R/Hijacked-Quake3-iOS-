name: Full Diagnostics Regression

on:
  push:
    branches: [dev/hijacked-port]
    paths:
      - '.github/workflows/full-diagnostics-regression.yml'
      - 'tools/patch_full_diagnostics_ios.py'
      - 'tests/test_full_diagnostics.py'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run diagnostics regression tests
        run: |
          python3 -m pip install --disable-pip-version-check pytest
          PYTHONPATH=. python3 -m pytest -q tests/test_patch_quake3_ios.py tests/test_full_diagnostics.py
