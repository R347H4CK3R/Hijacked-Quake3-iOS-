name: Hijacked Engine Map Smoke

on:
  push:
    branches: [dev/hijacked-port]
    paths:
      - '.github/workflows/runtime-map-smoke.yml'
      - 'runtime/hijacked-device.bsp.zlib.b64'
  workflow_dispatch:

jobs:
  map-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned ioquake3
        run: |
          git clone https://github.com/ioquake/ioq3.git "$RUNNER_TEMP/ioq3"
          cd "$RUNNER_TEMP/ioq3"
          git checkout 588393618dbc82e7207c21c6ddecca229944a03a
          test "$(git rev-parse HEAD)" = "588393618dbc82e7207c21c6ddecca229944a03a"

      - name: Build standalone dedicated server and QVM
        run: |
          cmake -S "$RUNNER_TEMP/ioq3" -B "$RUNNER_TEMP/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CLIENT=OFF \
            -DBUILD_SERVER=ON \
            -DBUILD_RENDERER_GL1=OFF \
            -DBUILD_RENDERER_GL2=OFF \
            -DBUILD_GAME_LIBRARIES=OFF \
            -DBUILD_GAME_QVMS=ON \
            -DBUILD_STANDALONE=ON
          cmake --build "$RUNNER_TEMP/build" -- -j2
          SERVER="$(find "$RUNNER_TEMP/build" -type f -perm -111 \( -name 'ioq3ded*' -o -name 'ioq3ded' \) -print -quit)"
          QAGAME="$(find "$RUNNER_TEMP/build" -type f -name 'qagame.qvm' -print -quit)"
          test -x "$SERVER"
          test -s "$QAGAME"
          printf '%s\n' "$SERVER" > "$RUNNER_TEMP/server-path.txt"
          printf '%s\n' "$QAGAME" > "$RUNNER_TEMP/qagame-path.txt"

      - name: Stage verified Hijacked map
        run: |
          ROOT="$RUNNER_TEMP/runtime"
          mkdir -p "$ROOT/baseq3/maps" "$ROOT/baseq3/vm"
          cp "$(cat "$RUNNER_TEMP/qagame-path.txt")" "$ROOT/baseq3/vm/qagame.qvm"
          export BSP_OUT="$ROOT/baseq3/maps/hijacked.bsp"
          python3 - <<'PY'
          import base64, os, struct, zlib
          from pathlib import Path
          encoded = ''.join(Path('runtime/hijacked-device.bsp.zlib.b64').read_text().split())
          data = zlib.decompress(base64.b64decode(encoded))
          assert data[:4] == b'IBSP'
          assert struct.unpack_from('<i', data, 4)[0] == 46
          Path(os.environ['BSP_OUT']).write_bytes(data)
          PY
          cat > "$ROOT/baseq3/default.cfg" <<'EOF'
          seta sv_pure "0"
          seta vm_game "1"
          EOF
          test -s "$ROOT/baseq3/maps/hijacked.bsp"
          test -s "$ROOT/baseq3/vm/qagame.qvm"

      - name: Load Hijacked in ioquake3 dedicated server
        run: |
          SERVER="$(cat "$RUNNER_TEMP/server-path.txt")"
          ROOT="$RUNNER_TEMP/runtime"
          set +e
          timeout 20s "$SERVER" \
            +set fs_basepath "$ROOT" \
            +set fs_homepath "$ROOT" \
            +set fs_game "" \
            +set sv_pure 0 \
            +set vm_game 1 \
            +set dedicated 2 \
            +map hijacked \
            +quit > "$RUNNER_TEMP/map-smoke.log" 2>&1
          STATUS=$?
          set -e
          cat "$RUNNER_TEMP/map-smoke.log"
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            exit "$STATUS"
          fi
          grep -F -- '----- Server Initialization -----' "$RUNNER_TEMP/map-smoke.log"
          grep -F -- 'hijacked' "$RUNNER_TEMP/map-smoke.log"
          if grep -Eiq '(^|[^a-z])(fatal|error):|couldn.t load|could not load|failed to load' "$RUNNER_TEMP/map-smoke.log"; then
            echo 'Fatal map-load signature detected'
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hijacked-map-smoke-log
          path: ${{ runner.temp }}/map-smoke.log
          if-no-files-found: ignore
