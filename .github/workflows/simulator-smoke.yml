name: iOS Simulator Runtime Smoke

on:
  push:
    branches: [dev/hijacked-port]
    paths:
      - '.github/workflows/simulator-smoke.yml'
      - 'tools/patch_quake3_ios.py'
      - 'tests/fixtures/hijacked-smoke.bsp.base64'
      - 'runtime/HijackedConfig.cfg'
  workflow_dispatch:

jobs:
  qvms:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch pinned ioquake3 source
        run: |
          git clone https://github.com/ioquake/ioq3.git "$RUNNER_TEMP/ioq3"
          cd "$RUNNER_TEMP/ioq3"
          git checkout 588393618dbc82e7207c21c6ddecca229944a03a
          test "$(git rev-parse HEAD)" = "588393618dbc82e7207c21c6ddecca229944a03a"
      - name: Build GPL baseq3 QVMs
        run: |
          cmake -S "$RUNNER_TEMP/ioq3" -B "$RUNNER_TEMP/ioq3-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_CLIENT=OFF \
            -DBUILD_SERVER=OFF \
            -DBUILD_RENDERER_GL1=OFF \
            -DBUILD_RENDERER_GL2=OFF \
            -DBUILD_GAME_LIBRARIES=OFF \
            -DBUILD_GAME_QVMS=ON \
            -DBUILD_STANDALONE=ON
          cmake --build "$RUNNER_TEMP/ioq3-build" -- -j2
          mkdir -p "$RUNNER_TEMP/qvms/vm"
          for NAME in qagame cgame ui; do
            SRC="$(find "$RUNNER_TEMP/ioq3-build" -type f -name "$NAME.qvm" | head -1)"
            test -s "$SRC"
            cp "$SRC" "$RUNNER_TEMP/qvms/vm/$NAME.qvm"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-qvms
          path: ${{ runner.temp }}/qvms
          if-no-files-found: error

  simulator-smoke:
    needs: qvms
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: simulator-qvms
          path: ${{ runner.temp }}/qvms

      - name: Fetch pinned Quake3-iOS runtime
        run: |
          git clone https://github.com/tomkidd/Quake3-iOS.git "$RUNNER_TEMP/Quake3-iOS"
          cd "$RUNNER_TEMP/Quake3-iOS"
          git checkout f4b38931a765315fa4c7201dfbed2dd4a9b2d65c
          test "$(git rev-parse HEAD)" = "f4b38931a765315fa4c7201dfbed2dd4a9b2d65c"

      - name: Patch deterministic Hijacked startup
        run: |
          PYTHONPATH=. python tools/patch_quake3_ios.py "$RUNNER_TEMP/Quake3-iOS"
          grep -F 'var selectedMap = "hijacked"' "$RUNNER_TEMP/Quake3-iOS/Quake3-iOS/GameViewController.swift"
          grep -F 'storyboardIdentifier="HijackedGameVC"' "$RUNNER_TEMP/Quake3-iOS/Quake3-iOS/Base.lproj/Main.storyboard"

      - name: Patch simulator-only networking linkage
        run: |
          PBX="$RUNNER_TEMP/Quake3-iOS/Quake3-iOS.xcodeproj/project.pbxproj"
          python3 - "$PBX" <<'PY'
          from pathlib import Path
          import re, sys
          p = Path(sys.argv[1])
          s = p.read_text()
          ids = (
              'A1565FE4210A0DEF00FA9BC9',
              'A1565FE8210A0E4A00FA9BC9',
              'A1565FE9210A0E4A00FA9BC9',
              'A1565FEB210A0E6F00FA9BC9',
          )
          for ident in ids:
              s = re.sub(r'^\s*' + re.escape(ident) + r' /\* .*? in Frameworks \*/,\n', '', s, flags=re.M)
          s = re.sub(r'^\s*USE_CURL,\n', '', s, flags=re.M)
          p.write_text(s)
          if 'USE_CURL,' in s:
              raise SystemExit('USE_CURL remained in project settings')
          for ident in ids:
              if re.search(r'^\s*' + re.escape(ident) + r' /\* .*? in Frameworks \*/,', s, re.M):
                  raise SystemExit(f'device-only framework linkage remained: {ident}')
          print('patched simulator networking linkage')
          PY

      - name: Build matching SDL 2.0.14 simulator archive
        run: |
          git clone --depth 1 --branch release-2.0.14 https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL-2.0.14"
          python3 - "$RUNNER_TEMP/SDL-2.0.14" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          changed = 0
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in {'.txt', '.cmake'}:
                  continue
              try:
                  s = p.read_text()
              except UnicodeDecodeError:
                  continue
              if '-Werror=declaration-after-statement' in s:
                  s2 = s.replace('-Werror=declaration-after-statement', '-Wno-error=declaration-after-statement')
                  p.write_text(s2)
                  changed += 1
          print(f'patched SDL warning policy in {changed} file(s)')
          if changed == 0:
              raise SystemExit('expected SDL warning policy flag was not found')
          PY
          cmake -S "$RUNNER_TEMP/SDL-2.0.14" -B "$RUNNER_TEMP/sdl-build" -G Xcode \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TEST=OFF
          cmake --build "$RUNNER_TEMP/sdl-build" --config Release -- -quiet
          SDL_LIB="$(find "$RUNNER_TEMP/sdl-build" -type f \( -name 'libSDL2.a' -o -name 'libSDL2-static.a' \) -print -quit)"
          test -s "$SDL_LIB"
          file "$SDL_LIB"
          cp "$SDL_LIB" "$RUNNER_TEMP/Quake3-iOS/Quake3/libs/ios/libsdl2_0_14_ios.a"
          xcrun lipo -info "$RUNNER_TEMP/Quake3-iOS/Quake3/libs/ios/libsdl2_0_14_ios.a" || true

      - name: Stage expected baseq3 bundle resource
        run: |
          BASEQ3="$HOME/Library/Application Support/quake3/baseq3"
          mkdir -p "$BASEQ3"
          printf '// CI staging placeholder; private Hijacked data is injected after build.\n' > "$BASEQ3/ci-placeholder.cfg"
          test -d "$BASEQ3"

      - name: Build simulator app
        run: |
          DERIVED="$RUNNER_TEMP/DerivedData"
          set +e
          xcodebuild \
            -project "$RUNNER_TEMP/Quake3-iOS/Quake3-iOS.xcodeproj" \
            -scheme Quake3-iOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build > "$RUNNER_TEMP/xcodebuild.log" 2>&1
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo '=== Xcode compiler/linker diagnostics ==='
            grep -nE 'error:|fatal error:|Undefined symbols|ld: |BUILD FAILED|Command .* failed' "$RUNNER_TEMP/xcodebuild.log" | tail -150 || true
            echo '=== End diagnostics ==='
            exit "$STATUS"
          fi
          tail -40 "$RUNNER_TEMP/xcodebuild.log"
          APP="$(find "$DERIVED/Build/Products" -type d -name 'Quake3-iOS.app' | head -1)"
          test -n "$APP"
          printf '%s\n' "$APP" > "$RUNNER_TEMP/app-path.txt"
          file "$APP/Quake3-iOS"

      - name: Inject standalone gamecode and smoke Hijacked BSP
        run: |
          APP="$(cat "$RUNNER_TEMP/app-path.txt")"
          mkdir -p "$APP/baseq3/vm" "$APP/baseq3/maps"
          rm -f "$APP/baseq3/ci-placeholder.cfg"
          for NAME in qagame cgame ui; do
            SRC="$RUNNER_TEMP/qvms/vm/$NAME.qvm"
            test -s "$SRC"
            cp "$SRC" "$APP/baseq3/vm/$NAME.qvm"
          done
          cat > "$APP/baseq3/default.cfg" <<'EOF'
          seta com_introplayed "1"
          seta sv_pure "0"
          seta vm_game "0"
          seta vm_cgame "0"
          seta vm_ui "0"
          seta com_maxfps "60"
          seta r_fullscreen "1"
          EOF
          cp runtime/HijackedConfig.cfg "$APP/baseq3/hijacked.cfg"
          base64 --decode tests/fixtures/hijacked-smoke.bsp.base64 > "$APP/baseq3/maps/hijacked.bsp" || \
            base64 -D tests/fixtures/hijacked-smoke.bsp.base64 > "$APP/baseq3/maps/hijacked.bsp"
          test -s "$APP/baseq3/maps/hijacked.bsp"
          test -s "$APP/baseq3/vm/qagame.qvm"

      - name: Boot iPhone simulator and launch runtime
        run: |
          RUNTIME="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); r=[x for x in d["runtimes"] if x.get("isAvailable") and x.get("name","").startswith("iOS")]; print(r[-1]["identifier"])')"
          DEVICE_TYPE="$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ds=d["devicetypes"]; pick=next((x for x in ds if x["name"]=="iPhone 16 Plus"), next(x for x in ds if x["name"].startswith("iPhone"))); print(pick["identifier"])')"
          UDID="$(xcrun simctl create HijackedSmoke "$DEVICE_TYPE" "$RUNTIME")"
          echo "$UDID" > "$RUNNER_TEMP/sim-udid.txt"
          xcrun simctl boot "$UDID"
          open -a Simulator
          xcrun simctl bootstatus "$UDID" -b
          APP="$(cat "$RUNNER_TEMP/app-path.txt")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "$BUNDLE_ID" > "$RUNNER_TEMP/bundle-id.txt"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" "$BUNDLE_ID" | tee "$RUNNER_TEMP/launch.txt"
          sleep 12
          xcrun simctl spawn "$UDID" ps -ax | tee "$RUNNER_TEMP/ps.txt"
          grep -q 'Quake3-iOS' "$RUNNER_TEMP/ps.txt"

      - name: Collect runtime log and reject crash
        if: always()
        run: |
          UDID="$(cat "$RUNNER_TEMP/sim-udid.txt" 2>/dev/null || true)"
          if [ -n "$UDID" ]; then
            xcrun simctl spawn "$UDID" log show --last 2m --style compact \
              --predicate 'process == "Quake3-iOS" OR eventMessage CONTAINS[c] "Quake3-iOS"' \
              > "$RUNNER_TEMP/runtime.log" 2>&1 || true
            cat "$RUNNER_TEMP/runtime.log" || true
            if grep -Eiq 'Terminating app due to uncaught exception|EXC_BAD_ACCESS|SIGABRT|fatal error' "$RUNNER_TEMP/runtime.log"; then
              echo 'runtime crash signature detected'
              exit 1
            fi
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl delete "$UDID" || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-smoke-logs
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/launch.txt
            ${{ runner.temp }}/runtime.log
            ${{ runner.temp }}/ps.txt
          if-no-files-found: ignore
