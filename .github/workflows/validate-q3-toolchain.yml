name: Validate Quake 3 Toolchain

on:
  push:
    branches: [dev/hijacked-port]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: PYTHONPATH=. pytest -q

  q3map2-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NetRadiant build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libx11-dev libgtk2.0-dev libgtkglext1-dev libxml2-dev \
            libjpeg-dev libwebp-dev libminizip-dev zlib1g-dev
      - name: Build q3map2 only
        run: |
          git clone --depth 1 https://gitlab.com/xonotic/netradiant.git "$RUNNER_TEMP/netradiant"
          cmake -S "$RUNNER_TEMP/netradiant" -B "$RUNNER_TEMP/netradiant/build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_RADIANT=OFF \
            -DBUILD_TOOLS=ON \
            -DDOWNLOAD_GAMEPACKS=OFF
          cmake --build "$RUNNER_TEMP/netradiant/build" --target q3map2 -- -j2
          Q3MAP2="$(find "$RUNNER_TEMP/netradiant/build" -type f -name q3map2 -perm -111 | head -1)"
          test -n "$Q3MAP2"
          mkdir -p "$RUNNER_TEMP/q3map2-artifact/lib"
          cp "$Q3MAP2" "$RUNNER_TEMP/q3map2-artifact/q3map2"
          JPEG_LIB="$(ldd "$Q3MAP2" | awk '/libjpeg\.so\.8/ {print $3; exit}')"
          test -n "$JPEG_LIB"
          cp -L "$JPEG_LIB" "$RUNNER_TEMP/q3map2-artifact/lib/libjpeg.so.8"
          ldd "$Q3MAP2"
      - name: Generate synthetic stage through the real exporter
        run: |
          ROOT="$RUNNER_TEMP/q3smoke/baseq3"
          mkdir -p "$ROOT"
          PYTHONPATH=. ROOT="$ROOT" python - <<'PY'
          import os
          from pathlib import Path
          import struct

          from tools.build_hijacked_q3 import write_stage
          from tools.t6ps3.clipmesh import CollisionMeshView
          from tools.t6ps3.mapents import MapEntsView

          data = bytearray()
          for vertex in ((-32.0, -32.0, 0.0), (32.0, -32.0, 0.0), (0.0, 32.0, 64.0)):
              data += struct.pack(">3f", *vertex)
          index_offset = len(data)
          data += struct.pack(">3H", 0, 1, 2)
          mesh = CollisionMeshView(
              0,
              index_offset,
              3,
              1,
              0,
              (-32.0, -32.0, 0.0),
              (32.0, 32.0, 64.0),
          )
          mapents = MapEntsView(
              0,
              0,
              0,
              "",
              ({"classname": "mp_dm_spawn", "origin": "0 0 32", "angles": "0 90 0"},),
          )
          write_stage(bytes(data), mesh, mapents, Path(os.environ["ROOT"]))
          PY
      - name: Compile and validate synthetic dual-model BSP
        run: |
          ROOT="$RUNNER_TEMP/q3smoke"
          Q3MAP2="$RUNNER_TEMP/q3map2-artifact/q3map2"
          LD_LIBRARY_PATH="$RUNNER_TEMP/q3map2-artifact/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            "$Q3MAP2" -game quake3 -fs_basepath "$ROOT" -fs_game baseq3 \
            -bsp "$ROOT/baseq3/maps/hijacked.map"
          PYTHONPATH=. python -m tools.q3.bsp \
            "$ROOT/baseq3/maps/hijacked.bsp" \
            --min-brushes 7 --min-drawverts 3 --min-drawfaces 1
          ls -lh "$ROOT/baseq3/maps/hijacked.bsp"
      - uses: actions/upload-artifact@v4
        with:
          name: q3map2-linux-x64-portable
          path: ${{ runner.temp }}/q3map2-artifact
          if-no-files-found: error
