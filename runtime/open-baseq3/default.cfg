// Minimal GPL-compatible runtime configuration for the standalone Hijacked port.
seta com_introplayed "1"
seta sv_pure "0"
seta g_gametype "0"
seta sv_maxclients "8"
seta cg_drawGun "1"
seta cg_fov "90"
seta cl_run "1"
seta sensitivity "5"
seta r_fullscreen "1"
seta s_volume "0.8"
bind W "+forward"
bind S "+back"
bind A "+moveleft"
bind D "+moveright"
bind SPACE "+moveup"
bind MOUSE1 "+attack"
